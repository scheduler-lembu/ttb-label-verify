# Fly.io deployment config for the TTB label verification prototype.
#
# NOT deployed in this pass — this file is prepared and validated locally only.
# The app name below may need to be changed at launch (Fly requires a globally
# unique name); the user picks the final name. The same container image also
# targets TTB's Azure tenant for production (see ARCHITECTURE.md).
#
# The API key is provided at deploy time as a Fly secret
# (`fly secrets set API_KEY=...`) — never committed here or baked into the image.

app = "ttb-label-verify"        # may need a different globally-unique name at launch
primary_region = "iad"          # US East (Ashburn); change to a region near users

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0      # scale to zero when idle -> near-zero cost

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1024mb"             # headroom for the retained in-memory jobs
  cpus = 1                      # shared
